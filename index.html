<style>
/* Layout: one-screen stage. The board is a detective's desk at night; scenes play on a letterboxed cinema layer that covers it. */
:root{
  color-scheme: dark;
  --ink:#09090c;
  --smoke:#16161b;
  --fog:#8d8a95;
  --paper:#e8e1d1;
  --blood:#b3121b;
  --amber:#d9a441;
  --steel:#7f9cc7;
  --t-gray:#3a3940;
  --t-yellow:#c49a2c;
  --t-green:#4e8a55;
  --f-display:'Limelight','Bodoni 72',Didot,'Times New Roman',serif;
  --f-impact:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --f-voice:'Cormorant Garamond',Garamond,Georgia,serif;
  --f-type:'Special Elite','Courier New',monospace;
  --f-talk:'Courier Prime','Courier New',monospace;
  --lb:8vh;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--f-talk);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---------- global layers ---------- */
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden}
#backdrop svg{position:absolute;inset:-3%;width:106%;height:106%;transition:filter 2s}
#backdrop.dim svg{filter:grayscale(.75) contrast(1.1) brightness(.42) blur(2px)}
#backdrop.title svg{filter:grayscale(.55) contrast(1.15) brightness(.7)}
#backdrop::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.85) 100%);transition:background 2s}
body.stakes-4 #backdrop::after{background:radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(40,0,0,.9) 100%)}
body.stakes-5 #backdrop::after,body.stakes-6 #backdrop::after{background:radial-gradient(ellipse at 50% 45%,transparent 18%,rgba(70,0,4,.92) 100%)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#grain{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none;opacity:.075;mix-blend-mode:overlay;image-rendering:pixelated}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9}
.logo .w{font-family:var(--f-display);font-size:clamp(56px,13vw,150px);letter-spacing:.06em;color:var(--paper);text-shadow:0 0 30px rgba(217,164,65,.35),0 6px 0 #000}
.logo .n{margin-top:-.15em;background:var(--blood);color:#fff;font-family:var(--f-impact);font-weight:900;font-size:clamp(40px,9vw,104px);letter-spacing:.42em;padding:.04em .2em .04em .62em;transform:skewX(-14deg) rotate(-3deg);box-shadow:10px 10px 0 #000;animation:titleSlam .9s cubic-bezier(.2,1.6,.4,1) .3s both}
@keyframes titleSlam{from{transform:skewX(-14deg) rotate(-3deg) scale(2.6);opacity:0}to{transform:skewX(-14deg) rotate(-3deg) scale(1);opacity:1}}
.tagline{font-family:var(--f-type);font-size:clamp(15px,2vw,20px);letter-spacing:.18em;text-transform:uppercase;color:#cfc7b6;text-wrap:balance}
.bigbtn{background:transparent;border:2px solid var(--paper);padding:16px 30px;font-family:var(--f-impact);font-weight:900;font-size:clamp(20px,2.6vw,28px);letter-spacing:.2em;text-transform:uppercase;position:relative;transition:background .2s,color .2s}
.bigbtn:hover{background:var(--paper);color:var(--ink)}
.fine{font-family:var(--f-type);font-size:13px;color:#a39e93;max-width:46ch;line-height:1.6;text-wrap:balance}

/* ---------- board ---------- */
#board{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4dvh,14px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  --tile:clamp(34px,min(calc((100dvh - 400px) / 6.3),calc((100vw - 60px) / 5.4)),64px);--keyh:clamp(38px,6.4dvh,54px)}
.bar{width:min(760px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:1px solid rgba(232,225,209,.18);padding-block:4px 10px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.08em;white-space:nowrap}
.brand b{font-family:var(--f-impact);font-weight:900;background:var(--blood);color:#fff;padding:0 .35em;margin-left:.25em;display:inline-block;transform:skewX(-12deg);letter-spacing:.2em}
.casebox{text-align:center;min-width:0}
.caseno{font-family:var(--f-type);font-size:11px;letter-spacing:.25em;color:#a39e93}
.casetitle{font-family:var(--f-impact);font-weight:700;font-size:clamp(16px,2.4vw,22px);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;justify-content:flex-end;gap:8px}
.tbtn{background:rgba(9,9,12,.6);border:1px solid rgba(232,225,209,.35);padding:6px 10px;font-family:var(--f-type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.tbtn:hover:not(:disabled){border-color:var(--paper)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.status{width:min(520px,100%);display:flex;justify-content:space-between;align-items:center;gap:16px}
.clock{display:flex;align-items:baseline;gap:6px}
.clock b{font-family:var(--f-impact);font-weight:900;font-size:clamp(28px,4.4dvh,40px);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--amber);text-shadow:0 0 16px rgba(217,164,65,.45)}
.clock small{font-family:var(--f-impact);font-weight:700;font-size:16px;color:var(--amber)}
.clock span{font-family:var(--f-type);font-size:11px;letter-spacing:.14em;color:#a39e93;text-transform:uppercase;margin-left:6px;line-height:1.3}
.smokes{display:flex;gap:6px;align-items:center}
.smokes svg{width:clamp(30px,5.5vw,40px);height:auto;transition:opacity .6s,filter .6s}
.smokes svg.burnt{opacity:.35;filter:grayscale(1)}
.smokes svg.lit .ember{animation:ember 1.4s ease-in-out infinite alternate}
@keyframes ember{from{fill:#ff5a1a}to{fill:#ffb347}}
.memo{min-height:2.6em;max-width:min(560px,100%);text-align:center;font-family:var(--f-voice);font-style:italic;font-weight:600;font-size:clamp(16px,2.2dvh,20px);line-height:1.3;color:#e3dccb;text-wrap:balance;text-shadow:0 2px 8px #000}
#grid{display:grid;gap:6px;perspective:800px}
.row{display:grid;grid-template-columns:repeat(5,var(--tile));gap:6px;transition:opacity .6s,filter .6s}
.row.shake{animation:rowshake .45s}
@keyframes rowshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tile{width:var(--tile);height:var(--tile);display:grid;place-items:center;font-family:var(--f-type);font-size:calc(var(--tile) * .56);line-height:1;text-transform:uppercase;color:var(--paper);border:2px dashed rgba(232,225,209,.2);background:rgba(8,8,11,.6);box-sizing:border-box;transform:rotate(var(--rot,0deg))}
.tile.filled{border:2px solid #cfc5ae;background:#ddd3bd;color:#1b1814;box-shadow:0 3px 0 rgba(0,0,0,.6)}
.tile.pop{animation:pop .12s}
@keyframes pop{50%{transform:scale(1.08) rotate(var(--rot,0deg))}}
.tile[data-s="gray"]{background:var(--t-gray);border-color:#2b2a30;color:#bdb8ae;box-shadow:none}
.tile[data-s="yellow"]{background:var(--t-yellow);border-color:#a37e1f;color:#14100a;box-shadow:0 0 18px rgba(196,154,44,.35)}
.tile[data-s="green"]{background:var(--t-green);border-color:#3c6e42;color:#f3f0e6;box-shadow:0 0 22px rgba(78,138,85,.45)}
.tile.flip{animation:flip .8s ease-in-out}
@keyframes flip{0%{transform:rotateX(0) rotate(var(--rot,0deg))}40%{transform:rotateX(90deg)}100%{transform:rotateX(0) rotate(var(--rot,0deg))}}
#board.interrogate .row:not(.focus){opacity:.18;filter:blur(1.5px)}
#board.interrogate .row.focus{filter:drop-shadow(0 0 30px rgba(255,217,138,.25))}
#kb{width:min(520px,100%);display:flex;flex-direction:column;gap:7px;margin-top:auto}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;min-width:0;height:var(--keyh);border-radius:999px;border:2px solid #7d786d;background:radial-gradient(circle at 45% 35%,#34333a,#141418 70%);font-family:var(--f-type);font-size:clamp(14px,2.3dvh,18px);text-transform:uppercase;color:var(--paper);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.08);padding:0;transition:transform .05s,background .3s}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.key.wide{flex:1.7;border-radius:14px;font-size:12px;letter-spacing:.08em}
.key[data-s="gray"]{background:#202024;border-color:#3a3940;color:#6d6a66}
.key[data-s="yellow"]{background:var(--t-yellow);border-color:#e0bb55;color:#14100a}
.key[data-s="green"]{background:var(--t-green);border-color:#79b07f;color:#fff}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translate(-50%,-10px);z-index:40;background:#e8e1d1;color:#16130f;font-family:var(--f-type);padding:10px 18px;font-size:15px;box-shadow:6px 6px 0 #000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- cinema ---------- */
#cinema{position:fixed;inset:0;z-index:10;background:#000;overflow:hidden;cursor:wait}
#cam{position:absolute;inset:0}
#cam.shake{animation:camshake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes camshake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(6px,-3px)}30%,50%,70%{transform:translate(-10px,4px)}40%,60%{transform:translate(10px,-2px)}}
.bgs{position:absolute;inset:0;transition:filter 1.6s}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.bg.on{opacity:1}
.bg svg{position:absolute;inset:-4%;width:108%;height:108%}
.bg.kb1 svg{animation:kb1 34s ease-in-out infinite alternate}
.bg.kb2 svg{animation:kb2 34s ease-in-out infinite alternate}
.bg.push svg{animation:push 6s ease-out forwards}
@keyframes kb1{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.5%,-1%)}}
@keyframes kb2{from{transform:scale(1.06) translate(1%,0)}to{transform:scale(1) translate(-1%,1%)}}
@keyframes push{to{transform:scale(1.18)}}
#crain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#moodlay{position:absolute;inset:0;mix-blend-mode:color;opacity:0;transition:opacity 1.6s,background-color 1.6s;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.88) 100%);transition:background 1.6s}
#vig.pulse{animation:vpulse 1.1s ease-out}
@keyframes vpulse{0%{box-shadow:inset 0 0 0 0 rgba(179,18,27,0)}25%{box-shadow:inset 0 0 160px 40px rgba(179,18,27,.75)}100%{box-shadow:inset 0 0 0 0 rgba(179,18,27,0)}}
#cinema[data-mood="noir"] .bgs{filter:grayscale(.85) contrast(1.15) brightness(.9)}
#cinema[data-mood="warm"] .bgs{filter:sepia(.45) saturate(1.25) contrast(1.1) brightness(.95)}
#cinema[data-mood="gold"] .bgs{filter:sepia(.75) saturate(1.7) contrast(1.15) brightness(1.08)}
#cinema[data-mood="blue"] .bgs{filter:grayscale(.7) contrast(1.25) brightness(.85)}
#cinema[data-mood="red"] .bgs{filter:grayscale(1) contrast(1.7) brightness(.82)}
#cinema[data-mood="sick"] .bgs{filter:grayscale(.8) contrast(1.35) brightness(.78)}
#cinema[data-mood="violet"] .bgs{filter:grayscale(.85) contrast(1.25) brightness(.9)}
#cinema[data-mood="blue"] #moodlay{background-color:#1d3f7a;opacity:.75}
#cinema[data-mood="red"] #moodlay{background-color:#c0101c;opacity:.9}
#cinema[data-mood="gold"] #moodlay{background-color:#c58b2a;opacity:.3}
#cinema[data-mood="sick"] #moodlay{background-color:#4f6b3a;opacity:.7}
#cinema[data-mood="violet"] #moodlay{background-color:#6a3fa0;opacity:.7}
#cinema[data-mood="red"] #vig{background:radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(30,0,0,.95) 100%)}
.lb{position:absolute;left:0;right:0;height:var(--lb);background:#000;z-index:5;transition:height 1.2s cubic-bezier(.6,0,.2,1)}
#lbTop{top:0}#lbBot{bottom:0}
#cinema.tight{--lb:14vh}

#narr{position:absolute;left:50%;bottom:calc(var(--lb) + 3vh);transform:translateX(-50%);width:min(1000px,calc(100% - 40px));z-index:6;padding:18px 26px;box-sizing:border-box;
  font-family:var(--f-voice);font-style:italic;font-weight:600;font-size:clamp(20px,2.6vw,34px);line-height:1.32;color:#f3ecdc;text-shadow:0 2px 14px #000,0 0 3px #000;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.6) 12%,rgba(0,0,0,.6) 88%,transparent);opacity:0;transition:opacity .35s;min-height:3.2em;text-wrap:pretty;transition:bottom 1.2s,opacity .35s}
#narr.on{opacity:1}
#narr em{color:var(--amber);font-style:italic}
#dlg{position:absolute;left:50%;bottom:calc(var(--lb) + 2.4vh);transform:translateX(-50%);width:min(1100px,calc(100% - 28px));z-index:6;display:flex;align-items:flex-end;opacity:0;transition:opacity .3s,bottom 1.2s;--c:#d9a441}
#dlg.on{opacity:1}
.portrait{flex:none;width:clamp(86px,15vw,210px);aspect-ratio:220/260;position:relative;z-index:2;margin-right:-22px}
.portrait::before{content:'';position:absolute;inset:14% -6% 0 -2%;background:linear-gradient(140deg,var(--c),transparent 75%);opacity:.5;clip-path:polygon(10% 0,100% 8%,90% 100%,0 94%)}
.portrait::after{content:'';position:absolute;inset:14% -6% 0 -2%;background:radial-gradient(var(--c) 1.2px,transparent 1.8px) 0 0/7px 7px;opacity:.35;clip-path:polygon(10% 0,100% 8%,90% 100%,0 94%);-webkit-mask:linear-gradient(180deg,#000,transparent 80%);mask:linear-gradient(180deg,#000,transparent 80%)}
.portrait svg{position:relative;width:100%;height:100%;filter:drop-shadow(-3px -2px 0 var(--c)) drop-shadow(0 0 16px var(--c))}
#dlg.enter .portrait{animation:pin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pin{from{transform:translateX(-60px) skewX(-8deg);opacity:0}to{transform:none;opacity:1}}
.dwrap{position:relative;flex:1;min-width:0}
.nameplate{position:absolute;top:-24px;left:34px;z-index:3;background:var(--c);color:#0a0a0c;font-family:var(--f-impact);font-weight:900;letter-spacing:.1em;padding:3px 18px 2px;transform:skewX(-14deg);font-size:clamp(15px,1.9vw,24px);box-shadow:5px 5px 0 #000;white-space:nowrap}
.nameplate span{display:inline-block;transform:skewX(14deg)}
.dbox{background:rgba(5,5,7,.9);border-top:3px solid var(--c);clip-path:polygon(0 0,100% 0,98.5% 100%,1.5% 100%);padding:26px 30px 20px 40px;min-height:5.4em;box-sizing:border-box;
  font-family:var(--f-talk);font-size:clamp(16px,1.9vw,24px);line-height:1.45;color:#efe8d8}
.dbox em{color:var(--c);font-style:normal;font-weight:700}

#fx{position:absolute;inset:0;z-index:8;pointer-events:none}
#black{position:absolute;inset:0;background:#000;z-index:20;opacity:1;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;z-index:21;opacity:0;pointer-events:none}

/* cut-in */
.cutin{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:0;overflow:hidden}
.ci-eyes{height:clamp(90px,19vh,190px);transform:translateX(-110%) skewY(-5deg);transition:transform .32s cubic-bezier(.2,1.2,.3,1);border-top:4px solid var(--c);border-bottom:4px solid var(--c);box-shadow:0 0 0 6px #000;background:#000}
.ci-eyes svg{width:100%;height:100%;display:block}
.ci-band{position:relative;transform:translateX(110%) skewY(-5deg);transition:transform .3s cubic-bezier(.2,1.2,.3,1) .08s;background:var(--blood);padding:clamp(8px,2vh,22px) 4vw;box-shadow:0 0 0 6px #000,0 0 0 9px var(--paper)}
.ci-band::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 38px);animation:speed .3s linear infinite}
@keyframes speed{to{background-position:-76px 0}}
.ci-band span{position:relative;display:block;font-family:var(--f-impact);font-weight:900;font-size:clamp(40px,8.5vw,128px);line-height:.95;letter-spacing:.03em;color:#fff;text-shadow:6px 6px 0 #000;text-transform:uppercase;text-align:center;text-wrap:balance}
.cutin.in .ci-eyes,.cutin.in .ci-band{transform:translateX(0) skewY(-5deg)}
.cutin.out .ci-eyes{transform:translateX(110%) skewY(-5deg);transition-duration:.25s}
.cutin.out .ci-band{transform:translateX(-110%) skewY(-5deg);transition-duration:.25s;transition-delay:0s}

/* heavy statement */
.heavy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 6vw;background:radial-gradient(ellipse at 50% 55%,#5a0008 0%,#1c0002 55%,#000 100%);opacity:0;transition:opacity .4s}
.heavy.blue{background:radial-gradient(ellipse at 50% 55%,#0d2a5c 0%,#020a1c 55%,#000 100%)}
.heavy.gold{background:radial-gradient(ellipse at 50% 55%,#5c3f08 0%,#1c1202 55%,#000 100%)}
.heavy.on{opacity:1}
.heavy p{margin:0;text-align:center;font-family:var(--f-voice);font-weight:700;font-size:clamp(34px,6.4vw,96px);line-height:1.06;letter-spacing:.02em;color:#fff;text-transform:uppercase;text-wrap:balance;text-shadow:0 0 40px rgba(255,40,40,.35)}
.heavy.blue p{text-shadow:0 0 40px rgba(80,140,255,.4)}
.heavy p span{display:inline-block;opacity:0;margin:0 .14em}
.heavy p span.hit{animation:slam .38s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slam{from{opacity:0;transform:scale(2.2);filter:blur(6px)}to{opacity:1;transform:scale(1);filter:none}}

/* versus */
.versus{position:absolute;inset:0;overflow:hidden}
.vs-half{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,1.1,.3,1)}
.vs-l{background:linear-gradient(120deg,#0b1d42,#02060f 70%);clip-path:polygon(0 0,58% 0,42% 100%,0 100%);transform:translateX(-100%)}
.vs-r{background:linear-gradient(300deg,#5a0008,#0f0001 70%);clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%);transform:translateX(100%)}
.versus.in .vs-half{transform:none}
.vs-half svg{position:absolute;bottom:0;height:86%;width:auto}
.vs-l svg{left:2%;filter:drop-shadow(-4px -2px 0 #7fb2ff) drop-shadow(0 0 30px #3a74d6)}
.vs-r svg{right:2%;filter:drop-shadow(4px -2px 0 #ff4a4a) drop-shadow(0 0 30px #c0101c)}
.vs-name{position:absolute;font-family:var(--f-impact);font-weight:900;font-size:clamp(26px,4.6vw,76px);line-height:.95;color:#fff;letter-spacing:.05em;text-shadow:5px 5px 0 #000;max-width:36vw;text-wrap:balance}
.vs-l .vs-name{left:4vw;top:16vh}
.vs-r .vs-name{right:4vw;bottom:16vh;text-align:right}
.vs-tag{display:block;font-family:var(--f-type);font-weight:400;font-size:clamp(12px,1.3vw,18px);letter-spacing:.3em;color:#cfc7b6}
.vs-line{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s .45s;filter:drop-shadow(0 0 10px #fff)}
.versus.in .vs-line{opacity:1}

/* title card */
.card{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 24px;opacity:0;transition:opacity .7s;text-align:center}
.card.on{opacity:1}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,84px);letter-spacing:.14em;color:var(--paper);text-wrap:balance;animation:cardIn 2.4s ease-out both}
@keyframes cardIn{from{letter-spacing:.42em;opacity:0;filter:blur(8px)}to{letter-spacing:.14em;opacity:1;filter:none}}
.card p{margin:0;font-family:var(--f-type);font-size:clamp(15px,1.9vw,22px);letter-spacing:.12em;color:#b9b2a3;max-width:44ch;min-height:1.4em;text-wrap:balance}
.card .rule{width:min(320px,60%);height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}

/* stamp */
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-11deg) scale(3);opacity:0;font-family:var(--f-impact);font-weight:900;font-size:clamp(46px,9vw,140px);letter-spacing:.08em;color:#d0111e;border:.07em solid #d0111e;padding:.02em .3em;white-space:nowrap;mix-blend-mode:screen;
  -webkit-mask:repeating-radial-gradient(circle at 30% 40%,#000 0 3px,rgba(0,0,0,.72) 3px 5px);mask:repeating-radial-gradient(circle at 30% 40%,#000 0 3px,rgba(0,0,0,.72) 3px 5px)}
.stamp.green{color:#5fc46d;border-color:#5fc46d}
.stamp.in{animation:stampIn .32s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes stampIn{to{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:.95}}

/* paper + clue */
.paper{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-2deg);width:min(620px,calc(100% - 40px));background:#e6dcc4;color:#1d1a15;padding:28px 32px 32px;box-sizing:border-box;box-shadow:0 30px 60px rgba(0,0,0,.8),inset 0 0 60px rgba(120,90,40,.25);font-family:var(--f-type);opacity:0;transition:opacity .4s,transform .5s}
.paper.on{opacity:1;transform:translate(-50%,-50%) rotate(-1deg)}
.paper .lbl{font-size:12px;letter-spacing:.3em;border-bottom:1px solid #8b7f66;padding-bottom:8px;margin-bottom:16px;color:#5b5140}
.paper .txt{font-size:clamp(18px,2.4vw,26px);line-height:1.5;min-height:2.6em}
.paper .big{font-family:var(--f-impact);font-weight:900;font-size:clamp(70px,13vw,170px);line-height:.9;text-align:center;color:#141210;letter-spacing:.04em}
.paper .sub{text-align:center;font-size:clamp(16px,2vw,22px);letter-spacing:.14em;margin-top:8px}
.paper .tag{position:absolute;right:20px;top:-14px;background:var(--blood);color:#fff;font-family:var(--f-impact);font-weight:900;letter-spacing:.15em;padding:4px 12px;font-size:14px;transform:rotate(4deg)}

/* legend */
.legend{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:clamp(14px,4vw,48px);opacity:0;transition:opacity .5s;width:max-content;max-width:calc(100% - 32px)}
.legend.on{opacity:1}
.legend > div{display:flex;flex-direction:column;align-items:center;gap:12px;width:clamp(92px,18vw,190px);text-align:center}
.legend .tile{--tile:clamp(56px,9vw,96px)}
.legend label{font-family:var(--f-type);font-size:clamp(11px,1.4vw,15px);letter-spacing:.12em;color:#e3dccb;line-height:1.4;min-height:2.8em;text-shadow:0 2px 6px #000}

/* report + modal */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:24px 16px;overflow-y:auto}
.file{position:relative;width:min(520px,100%);background:#e6dcc4;color:#1d1a15;padding:30px 30px 26px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.9),inset 0 0 70px rgba(120,90,40,.3);font-family:var(--f-type);transform:rotate(-.6deg);margin:auto}
.file h3{margin:0 0 4px;font-family:var(--f-impact);font-weight:900;font-size:28px;letter-spacing:.1em;text-transform:uppercase}
.file .meta{font-size:12px;letter-spacing:.22em;color:#5b5140;border-bottom:1px solid #8b7f66;padding-bottom:10px;margin-bottom:16px}
.file .verdict{position:absolute;right:18px;top:24px;font-family:var(--f-impact);font-weight:900;font-size:22px;letter-spacing:.1em;padding:2px 10px;border:3px solid;transform:rotate(8deg)}
.file .verdict.win{color:#2f6b37}.file .verdict.lose{color:#a3101a}
.file .ans{display:flex;gap:6px;justify-content:center;margin:6px 0 16px;--tile:clamp(40px,11vw,58px)}
.file .ans .tile{color:#f3f0e6}
.file table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.file td{padding:5px 4px;border-bottom:1px dotted #a39780}
.file td:last-child{text-align:right;color:#5b5140}
.file .mini{display:inline-flex;gap:2px;vertical-align:middle;margin-right:8px}
.file .mini i{width:12px;height:12px;display:inline-block}
.file .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.file .acts button{flex:1;min-width:150px;padding:12px;border:2px solid #1d1a15;background:transparent;font-family:var(--f-impact);font-weight:900;letter-spacing:.14em;font-size:17px;text-transform:uppercase;color:#1d1a15}
.file .acts button.primary{background:#1d1a15;color:#e6dcc4}
.file textarea{width:100%;margin-top:12px;font-family:var(--f-type);font-size:13px;height:120px;background:#f2ead6;border:1px solid #8b7f66;color:#1d1a15;box-sizing:border-box}
.file p{line-height:1.5;margin:0 0 6px}

@media (max-width:560px){
  .brand{display:none}
  .bar{grid-template-columns:1fr auto}
  .casebox{text-align:left}
  .clock span{display:none}
  #dlg{bottom:calc(var(--lb) + 1.4vh)}
  .portrait{margin-right:-30px}
  .dbox{padding:24px 18px 16px 34px}
  .nameplate{left:28px}
}
@media (prefers-reduced-motion: reduce){
  .bg.kb1 svg,.bg.kb2 svg,.bg.push svg{animation:none}
  #cam.shake{animation:none}
  .ci-band::before{animation:none}
}
/* svg ambient classes */
.flicker{animation:flicker 7s infinite}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.25}}
.swing{transform-box:view-box;transform-origin:800px 0;animation:swing 3.6s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.sweepA{transform-box:view-box;transform-origin:330px 900px;animation:sweep 9s ease-in-out infinite alternate}
.sweepB{transform-box:view-box;transform-origin:1380px 900px;animation:sweep 11s ease-in-out infinite alternate-reverse}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.rise{animation:rise 6s ease-in-out infinite;opacity:0}
.rise.d2{animation-delay:2s}.rise.d3{animation-delay:4s}
@keyframes rise{0%{opacity:0;transform:translateY(0)}30%{opacity:.5}100%{opacity:0;transform:translateY(-120px)}}
.shim{animation:shim 3.4s ease-in-out infinite alternate}
@keyframes shim{from{opacity:.15;transform:translateX(-12px)}to{opacity:.5;transform:translateX(12px)}}
</style>

// ================= ART: hand-built SVG sets & silhouettes =================
const ART = (() => {
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  <pattern id="nBrick" width="64" height="32" patternUnits="userSpaceOnUse"><rect width="64" height="32" fill="#191311"/><path d="M0,16H64M32,0V16M0,16V32M64,16V32M0,0H64" stroke="#080605" stroke-width="3"/></pattern>`;
  const svg = (inner, extra = '') => `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${DEFS}${extra}</defs>${inner}</svg>`;
  const f = n => Math.round(n);

  function skyline(r, base, maxH, color, lit, minW = 50, maxW = 170) {
    let x = -40, s = '';
    while (x < 1640) {
      const w = minW + r() * (maxW - minW), h = maxH * (0.3 + r() * 0.7), y = base - h;
      s += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h + 500)}" fill="${color}"/>`;
      if (r() < .22) s += `<rect x="${f(x + w / 2 - 2)}" y="${f(y - 46)}" width="3" height="46" fill="${color}"/>`;
      if (r() < .14) { const tx = x + w * .3; s += `<path d="M${f(tx)},${f(y)} L${f(tx + 6)},${f(y - 26)} M${f(tx + 34)},${f(y)} L${f(tx + 28)},${f(y - 26)}" stroke="${color}" stroke-width="4"/><rect x="${f(tx - 2)}" y="${f(y - 58)}" width="38" height="34" fill="${color}"/><path d="M${f(tx - 4)},${f(y - 58)} L${f(tx + 17)},${f(y - 74)} L${f(tx + 38)},${f(y - 58)} Z" fill="${color}"/>`; }
      if (lit > 0) for (let wy = y + 16; wy < base - 12; wy += 23) for (let wx = x + 9; wx < x + w - 12; wx += 17) if (r() < lit) s += `<rect x="${f(wx)}" y="${f(wy)}" width="7" height="11" fill="#f3c66b" opacity="${(.3 + r() * .6).toFixed(2)}"/>`;

  }
  const rainStreaks = (r, x0, y0, w, h, n) => { let s = ''; for (let i = 0; i < n; i++) { const x = x0 + r() * w, y = y0 + r() * h; s += `<path d="M${f(x)},${f(y)} l${f(-2 + r() * 4)},${f(14 + r() * 30)}" stroke="#cfd9ee" stroke-width="1.6" opacity="${(.15 + r() * .3).toFixed(2)}"/>`; } return s; };

  const SETS = {

function buildKB() {
  kb.innerHTML = '';
  for (const r of KEYROWS) { const row = document.createElement('div'); row.className = 'krow'; for (const k of r) { const b = document.createElement('button'); b.className = 'key' + (k === '+' || k === '-' ? ' wide' : ''); b.dataset.k = k; b.textContent = k === '+' ? 'ENTER' : k === '-' ? '⌫' : k; if (k === '-') b.setAttribute('aria-label', 'Delete'); b.addEventListener('click', () => press(k === '+' ? 'Enter' : k === '-' ? 'Backspace' : k)); row.appendChild(b); } kb.appendChild(row); }
}
function updateKB() {
  const best = {};
  S.guesses.forEach((g, gi) => S.fb[gi].forEach((v, i) => { best[g[i]] = Math.max(best[g[i]] ?? -1, v); }));
  kb.querySelectorAll('.key').forEach(b => { const v = best[b.dataset.k]; if (v != null) b.dataset.s = ['gray', 'yellow', 'green'][v]; else delete b.dataset.s; });
}
function renderRow() { const row = grid.children[S.guesses.length]; if (!row) return; [...row.children].forEach((t, i) => { const ch = S.cur[i] || ''; if (t.textContent !== ch) { t.textContent = ch; t.classList.toggle('filled', !!ch); if (ch) { t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); } } }); }
function updateStatus() {
  const g = S.guesses.length, nt = S.times[Math.min(g + 1, 6)];
  const [hh, mm] = S.over ? (S.won ? S.times[g] : [6, 0]) : nt; const s = fmtTime(hh, mm).split(' ');
  $('#clk').textContent = s[0]; $('#ampm').textContent = s[1];
  $('#smokes').innerHTML = Array.from({ length: 6 }, (_, i) => ART.cigarette(i < g ? 'burnt' : i === g && !S.over ? 'lit' : 'fresh')).join('');
  document.body.className = 'stakes-' + (g + 1);
}
function setMemo(t) { memo.textContent = t; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
function shakeRow() { const row = grid.children[S.guesses.length]; if (!row) return; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); AU.thud(); }

function press(k) {
  if (S.busy || S.over || !$('#modal').hidden) return;
  if (k === 'Enter') return submit();
  if (k === 'Backspace') { if (S.cur.length) { S.cur = S.cur.slice(0, -1); renderRow(); AU.key(); } return; }
  if (/^[a-z]$/i.test(k) && S.cur.length < 5) { S.cur += k.toLowerCase(); renderRow(); AU.key(); }
}
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; if (board.hidden) return; if (e.key === 'Enter' || e.key === 'Backspace' || /^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); press(e.key); } });

function baseVars() {
  const v = Object.assign({}, S.caseVars);
  S.times.forEach(([h, m], i) => v['time' + i] = fmtTime(h, m));
  return v;
}
function guessVars(g, guess, fb) {
  const greens = fb.filter(x => x === 2).length, yellows = fb.filter(x => x === 1).length, grays = 5 - greens - yellows, hits = greens + yellows, left = 6 - g;
  const v = baseVars();
  Object.assign(v, {
    guess, GUESS: guess.toUpperCase(), g, left, greens, yellows, grays, hits,
    hitsN: nounN(hits, 'letter', 'letters'), greensN: nounN(greens, 'letter', 'letters'), yellowsN: nounN(yellows, 'letter', 'letters'), graysN: nounN(grays, 'letter', 'letters'),
    leftN: nounN(left, 'guess', 'guesses'), leftW: NUMW[left] || left,
    time: fmtTime(...S.times[g]), nextTime: fmtTime(...S.times[Math.min(g + 1, 6)]), ANSWER: S.answer.toUpperCase()
  });
  ['hitsN', 'greensN', 'yellowsN', 'graysN', 'leftN', 'leftW'].forEach(k => v[cap(k)] = cap(v[k]));
  return v;
}
const bucketOf = fb => { const h = fb.filter(x => x > 0).length; return h === 0 ? 0 : h <= 2 ? 1 : h <= 4 ? 2 : 3; };

function pickUnused(list, set, idf) {
  let pool = list.filter(x => !set.has(idf(x)));
  if (!pool.length) { list.forEach(x => set.delete(idf(x))); pool = list; }
  const c = pick(pool); set.add(idf(c)); return c;
}
function withOpener(core) {
  return core.replace(/^@set (\w+)\s*$/m, (m, name) => { const o = OPENERS[name]; return o ? `${m}\n${pick(o)}` : m; });
}
function informant(g, b, ctx) {
  if (NOIR.forceInf === false) return '';
  let p = [0, .22, .35, .45, .5, .6][g] + (b === 0 ? .15 : 0); if (S.lastInf && g < 5) p *= .4;
  if (!NOIR.forceInf && R() > p) { S.lastInf = false; return ''; }
  const st = stats(); if (st.n < 1) return '';
  const types = ['n', 'dbl']; if (st.top) types.push('top'); if (st.pos) types.push('pos');
  const pool = INFORMANTS.filter(i => types.includes(i.type) && !S.infUsed.has(i.id)); if (!pool.length) return '';
  const inf = pick(pool); S.infUsed.add(inf.id); S.lastInf = true;
  const v = ctx.vars;
  Object.assign(v, { n: st.n, nN: nounN(st.n, 'word', 'words'), NWORDS: `${st.n} ${st.n === 1 ? 'WORD' : 'WORDS'}`, FIT: st.n === 1 ? 'FITS' : 'FIT', dblPct: st.dblPct });
  if (st.top) Object.assign(v, { topL: st.top.L, topPct: st.top.pct });
  if (st.pos) Object.assign(v, { posL: st.pos.L, posPct: st.pos.pct, posOrd: ORD[st.pos.i], POSORD: ORD[st.pos.i].toUpperCase(), posArt: 'AEFHILMNORSX'.includes(st.pos.L) ? 'an' : 'a' });
  const nm = inf.who ? CAST[inf.who].name : 'ANONYMOUS';
  ctx.clue = inf.type === 'n' ? { label: `${nm} · WORDS THAT STILL FIT YOUR EVIDENCE`, big: String(st.n), sub: st.n === 1 ? 'ONE NAME LEFT IN THE CITY' : `OUT OF ${ANSWERS.length} ON FILE` }
    : inf.type === 'top' ? { label: `${nm} · LETTER ODDS`, big: st.top.L, sub: `${st.top.pct}% CHANCE IT'S IN THE WORD` }
    : inf.type === 'pos' ? { label: `${nm} · ${ORD[st.pos.i].toUpperCase()} LETTER`, big: `${st.pos.L}`, sub: `${st.pos.pct}% CHANCE IN SPOT ${st.pos.i + 1}` }
    : { label: `${nm} · REPEATED LETTERS`, big: `${st.dblPct}%`, sub: 'CHANCE A LETTER SHOWS UP TWICE' };
  S.infLog.push(inf.id);
  return inf.s;
}

async function revealRow(r, fb) {
  const row = grid.children[r];
  board.classList.add('interrogate'); [...grid.children].forEach((x, i) => x.classList.toggle('focus', i === r));
  setMemo('Under the lamp...'); AU.heart(); await sleep(1100);
  for (let i = 0; i < 5; i++) {
    if (i === 4) { setMemo('One letter left to talk...'); AU.heart(); await sleep(1300); }
    const t = row.children[i]; t.classList.add('flip'); await sleep(320); t.dataset.s = ['gray', 'yellow', 'green'][fb[i]]; t.classList.remove('filled'); AU.flip(fb[i]); await sleep(560);
  }
  await sleep(500);
}
function verdictLine(fb) {
  const g = fb.filter(x => x === 2).length, y = fb.filter(x => x === 1).length, a = 5 - g - y;
  if (g === 5) return 'Every letter in place.';
  const parts = []; if (g) parts.push(`${cap(nounN(g, 'letter', 'letters'))} in the right place`); if (y) parts.push(`${nounN(y, 'letter', 'letters')} in the gang`); if (a) parts.push(`${nounN(a, 'alibi', 'alibis')}`);
  return parts.join(', ') + '.';
}

async function submit() {
  if (S.cur.length < 5) { shakeRow(); toast('Five letters, Lexington. Count them.'); return; }
  if (!ALLOWED.has(S.cur)) { shakeRow(); toast(`No record of ${S.cur.toUpperCase()} in this city.`); return; }
  S.busy = true; $('#newBtn').disabled = true;
  const guess = S.cur, fb = score(guess, S.answer); S.cur = ''; S.guesses.push(guess); S.fb.push(fb);
  const g = S.guesses.length;
  await revealRow(g - 1, fb);
  S.counts.push(candidates().length);
  updateKB(); setMemo(`${guess.toUpperCase()}: ${verdictLine(fb)}`); await sleep(2200);
  board.classList.remove('interrogate');
  const win = fb.every(x => x === 2), b = bucketOf(fb);
  const ctx = { vars: guessVars(g, guess, fb), flags: S.flags, clue: null };
  if (win) {
    S.over = true; S.won = true; ctx.vars.clockH = S.times[g][0]; ctx.vars.clockM = S.times[g][1];
    AU.riff(); await play(pick(WIN_CLIMAX) + pick(WIN_EPI[g]), ctx); updateStatus(); showReport(); return;
  }
  if (g === 6) {
    S.over = true; S.won = false; ctx.vars.clockH = 6; ctx.vars.clockM = 0;
    await play(pick(LOSS_CLIMAX) + pick(LOSS_EPI[b]), ctx); AU.piano([311.13, 293.66, 261.63, 196], .7); updateStatus(); showReport(); return;
  }
  const core = pickUnused(CORES[`${g}-${b}`], used.core, x => x);
  let script = withOpener(core);
  script += '\n' + informant(g, b, ctx);
  script += `\n## {nextTime} | ${pick(CLOSERS[6 - g])}`;
  S.g = g; updateStatus();
  await play(script, ctx);
  S.busy = false; $('#newBtn').disabled = false;
  setMemo(`Suspect ${g + 1} of 6. ${g === 5 ? 'Last chance before the train.' : 'Type a name. ENTER brings it in.'}`);
}

function genCase() {
  const intro = pickUnused(INTROS, used.intro, x => x.id);
  const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  return { intro, vars: {
    caseNo: String(1000 + Math.floor(R() * 9000)), date: `${pick(MON)} ${1 + Math.floor(R() * 28)}, 194${6 + Math.floor(R() * 4)}`,
    victim: pick(intro.id === 'singer' ? NAMES_F : NAMES_M), singer: pick(NAMES_F), pier: String(9 + Math.floor(R() * 40)), caseTitle: intro.title
  } };
}
async function newCase() {
  $('#report').hidden = true; $('#modal').hidden = true;
  const cs = genCase();
  S = { answer: NOIR.forceAnswer || pick(ANSWERS), guesses: [], fb: [], counts: [], cur: '', busy: true, over: false, won: false, g: 0, flags: {}, times: genTimes(), caseVars: cs.vars, infUsed: new Set(), infLog: [], lastInf: false, title: cs.intro.title };
  buildGrid(); buildKB(); updateStatus(); setMemo('');
  $('#caseNo').textContent = `CASE No. ${cs.vars.caseNo}`; $('#caseTitle').textContent = cs.intro.title;
  $('#newBtn').disabled = true;
  const ctx = { vars: baseVars(), flags: S.flags };
  ctx.vars.time = ctx.vars.time0;
  await play(cs.intro.s + '\n' + INTRO_TAIL, ctx);
  S.busy = false; $('#newBtn').disabled = false;
  setMemo('Suspect 1 of 6. Type a five-letter name. ENTER brings it in.');
}

function reportText() {
  const rows = S.fb.map(r => r.map(v => ['⬛', '🟨', '🟩'][v]).join('')).join('\n');
  return `WORDLE NOIR · Case No. ${S.caseVars.caseNo}\n${S.title}\n${S.won ? `CASE CLOSED ${S.guesses.length}/6` : 'COLD CASE X/6'}\n\n${rows}`;
}
function showReport() {
  const f = $('#reportFile');
  const tiles = S.answer.split('').map(c => `<div class="tile" data-s="${S.won ? 'green' : 'gray'}" style="--rot:0deg">${c}</div>`).join('');
  const rows = S.guesses.map((g, i) => `<tr><td><span class="mini">${S.fb[i].map(v => `<i style="background:${['#3a3940', '#c49a2c', '#4e8a55'][v]}"></i>`).join('')}</span>${g.toUpperCase()}</td><td>${S.counts[i] === 1 ? '1 word fits' : S.counts[i] + ' words fit'}</td></tr>`).join('');
  f.innerHTML = `<div class="verdict ${S.won ? 'win' : 'lose'}">${S.won ? 'CLOSED' : 'COLD'}</div>
    <h3>${S.title}</h3><div class="meta">CASE No. ${S.caseVars.caseNo} · ${S.caseVars.date.toUpperCase()}</div>
    <p>${S.won ? `Word apprehended after ${S.guesses.length} ${S.guesses.length === 1 ? 'suspect' : 'suspects'}.` : 'The word left on the 6:00 train. Its name was:'}</p>
    <div class="ans">${tiles}</div>
    <table aria-label="Suspects questioned">${rows}</table>
    <div class="acts"><button class="primary" id="rNew">Open a new case</button><button id="rCopy">Copy report</button></div>
    <div id="rCopyBox"></div>`;
  $('#report').hidden = false;
  $('#rNew').onclick = () => newCase();
  $('#rCopy').onclick = () => {
    const t = reportText();
    const fallback = () => { const box = $('#rCopyBox'); box.innerHTML = '<textarea readonly></textarea>'; const ta = box.querySelector('textarea'); ta.value = t; ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(t).then(() => { $('#rCopy').textContent = 'Copied'; }, fallback); } catch (e) { fallback(); }
  };
}

// ---------- wiring ----------
$('#backdrop').innerHTML = ART.SETS.street({});
RAIN.attach($('#rain')); RAIN.set('heavy');
$('#startBtn').addEventListener('click', async () => {
  AU.init(); AU.setRain('heavy', 0); AU.riff();
  $('#title').style.transition = 'opacity .9s'; $('#title').style.opacity = 0; await sleep(900);
  $('#title').hidden = true; $('#backdrop').innerHTML = ART.SETS.office({}); $('#backdrop').className = 'dim'; RAIN.set('light');
  board.hidden = false; newCase();
});
$('#sndBtn').addEventListener('click', () => { AU.init(); const on = AU.toggle(); $('#sndBtn').textContent = on ? 'Sound on' : 'Sound off'; $('#sndBtn').setAttribute('aria-pressed', on); });
$('#newBtn').addEventListener('click', () => { if (S.busy) return; if (S.over || !S.guesses.length) return newCase(); $('#modal').hidden = false; });
$('#mKeep').addEventListener('click', () => { $('#modal').hidden = true; });
$('#mDrop').addEventListener('click', () => { $('#modal').hidden = true; toast(`It was ${S.answer.toUpperCase()}. It always will be.`); newCase(); });

window.NOIR = { get S() { return S; }, VT, MISSING, set speed(v) { SPEED = v; }, get speed() { return SPEED; }, forceAnswer: null, forceInf: null, press, play, ANSWERS, ALLOWED, score, stats, parseScript };
})();
